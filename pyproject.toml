[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linxira-hardware-driver-manager"
version = "0.4.0"
description = "Hardware driver reporting, fixed planning, and root-owned diagnostics for Linxira OS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Linxira OS contributors"}]
dependencies = ["PySide6>=6.7"]

[project.scripts]
linxira-hardware-driver-manager = "linxira_hardware_driver_manager.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["data/org.linxira.HardwareDriverManager.desktop"]
"share/metainfo" = ["data/org.linxira.HardwareDriverManager.metainfo.xml"]
